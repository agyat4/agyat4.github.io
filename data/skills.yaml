      - id: qml-social
        icon: beaker
        title: Quantum Machine Learning for Conflict Fatality and Romantic Relationship Prediction
        dates: "2026"
        # context: "Advisor: [ADD]"   # hidden until the advisor is confirmed
        venue: { label: "SBP-BRiMS 2026, Springer LNCS", url: "https://doi.org/10.1007/978-3-032-40581-4_11" }
        description:
          - Built an end-to-end quantum machine learning pipeline for social and behavioral classification and evaluated four quantum classifiers against classical baselines on two social science datasets, a relationship-quality survey and armed-conflict fatality records, under identical experimental constraints.
        skills: [python, qiskit, sklearn, qml]

      - id: quantum-dot
        icon: beaker
        title: Quantum Dot Emission Analysis
        dates: "2026"
        context: "Advisors: Dr. Ignacio Segovia-Dominguez (WVU), Prof. Edward Flagg (WVU Physics)"
        venue: { label: "Optica 2026, accepted", url: "https://arxiv.org/abs/2606.28624" }
        description:
          - Designed spectral features from quantum dot emission measurements and applied unsupervised clustering to identify emission types.
        skills: [clustering]

      - id: eval-framework
        icon: beaker
        title: Evaluation and Diagnostic Framework for Spatiotemporal Forecasting
        dates: "2025 – Present"
        context: "Advisors: Dr. Ignacio Segovia-Dominguez, Dr. Vito D'Orazio (WVU)"
        venue: { label: "SBP-BRiMS 2025, Springer LNCS", url: "https://doi.org/10.1007/978-3-032-07715-8_16" }
        description:
          - Developing a comparison framework for grids of probability distributions; preliminary work published at SBP-BRiMS 2025. Journal paper in preparation.
        skills: [forecasting]

      - id: conflict-forecasting
        icon: beaker
        title: Conflict Fatality Forecasting
        dates: "2024 – 2025"
        context: "Advisors: Dr. Ignacio Segovia-Dominguez, Dr. Vito D'Orazio (WVU) | DRDC Fast Forward Challenge"
        description:
          - Built H2O AutoML models with Tweedie deviance loss for point prediction of armed conflict fatalities and PRIO-grid levels across 1-12 month horizons; derived probabilistic forecasts by parameterizing Tweedie distributions from predicted means.
        skills: [h2o, automl, forecasting]

      - id: solar-compression
        icon: beaker
        title: Multispectral Solar Image Compression
        dates: "2024 – 2025"
        context: "Advisor: Dr. Piyush Mehta (WVU) | NASA Goddard Space Flight Center"
        venue: { label: "IEEE ICMLA 2025", url: "https://arxiv.org/abs/2512.24463" }
        description:
          - Developed a graph-based learned compression model for NASA SDO solar imagery using spectral graph embeddings (iSWGE) and spatial graph attention (WSGA-C); on six EUV channels of SDOML, reduced Mean Spectral Information Divergence by 20.15% and improved log-transformed MS-SSIM by 1.62% at comparable bits-per-pixel rates.
        skills: [python, pytorch, compression, gnn]

