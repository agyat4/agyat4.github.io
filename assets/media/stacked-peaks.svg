<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a3030"></stop>
      <stop offset="1" stop-color="#0f6f66"></stop>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8f7ee" stop-opacity="0.0"></stop>
      <stop offset="0.5" stop-color="#b8f7ee" stop-opacity="0.35"></stop>
      <stop offset="1" stop-color="#b8f7ee" stop-opacity="0.0"></stop>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"></rect>

  <!-- subtle diagonal lines -->
  <g stroke="#b8f7ee" stroke-opacity="0.12" stroke-width="2">
    <path d="M-200,980 L380,340"></path>
    <path d="M-100,1080 L540,340"></path>
    <path d="M80,1080  L720,340"></path>
    <path d="M260,1080 L900,340"></path>
    <path d="M440,1080 L1080,340"></path>
    <path d="M620,1080 L1260,340"></path>
    <path d="M800,1080 L1440,340"></path>
    <path d="M980,1080 L1620,340"></path>
    <path d="M1160,1080 L1800,340"></path>
    <path d="M1340,1080 L1980,340"></path>
  </g>

  <!-- classical double-sided lamp post -->
  <g>
    <rect x="1857" y="185" width="12" height="775" rx="2" fill="#ddfff8" opacity="0.8"/>
    <rect x="1838" y="185" width="50" height="775" fill="url(#line)"/>
    <rect x="1852" y="165" width="22" height="10" rx="3" fill="#ddfff8"/>
    <path d="M1863 175 C1840 175 1834 160 1832 148" stroke="#ddfff8" stroke-width="4" fill="none"/>
    <path d="M1863 175 C1886 175 1892 160 1894 148" stroke="#ddfff8" stroke-width="4" fill="none"/>
    <rect x="1822" y="132" width="20" height="24" rx="3" fill="#fff" opacity="0.95"/>
    <rect x="1884" y="132" width="20" height="24" rx="3" fill="#fff" opacity="0.95"/>
    <circle cx="1832" cy="144" r="18" fill="#b8f7ee" opacity="0.12"/>
    <circle cx="1894" cy="144" r="18" fill="#b8f7ee" opacity="0.12"/>
  </g>
</svg>
